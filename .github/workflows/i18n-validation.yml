name: I18n validation

on:
  pull_request:
    branches:
      - Actions_Test
  push:
    branches:
      - Actions_Test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure gettext is available
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v msgfmt >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gettext
          fi

          msgfmt --version

      - name: Check PO files with msgfmt
        shell: bash
        run: |
          set -euo pipefail

          find po -name '*.po' -print0 | while IFS= read -r -d '' file; do
            echo "::group::msgfmt $file"
            msgfmt --check --output-file=/dev/null "$file"
            echo "::endgroup::"
          done

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        working-directory: tools
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        working-directory: tools
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        working-directory: tools
        run: cargo test --workspace --locked

      - name: Build SmartGit i18n tools
        working-directory: tools
        run: cargo build --release --locked -p smartgit-i18n-tools

      - name: Validate SmartGit translation files
        continue-on-error: true
        run: |
          set -euo pipefail

          ./tools/target/release/smartgit-i18n-tools validate \
            --pot po/messages.pot \
            --po-dir po
